<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מלווה הסדנה · דנשר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* מלווה הסדנה של Nexadapt. במה 1920×1080 שמתכווצת לכל מסך. צבעים לפי מערכת המצגות: טקסט 7:1 לפחות */
:root{
  --deep:#0C2831; --bg:#113640; --card:#183F4A; --line:#2E4C55;
  --paper:#F1F4F4; --ink2:#C2D0D4; --cap:#B3C5CA; --citron:#C6D63F;
  --font:'Heebo','Arial Hebrew',Arial,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--paper);font-family:var(--font);overflow:hidden}
button{font-family:inherit}
.vp{position:fixed;inset:0;background:#000}
#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden}

/* שקף */
.slide{position:absolute;inset:0;padding:112px 112px 150px;display:flex;flex-direction:column}
.kicker{margin:0;font-size:40px;font-weight:700;line-height:1.2;color:var(--citron)}
.h{margin:14px 0 0;font-size:96px;font-weight:900;line-height:1.08;letter-spacing:-1px;max-width:1640px;text-wrap:balance}
.sub{margin:28px 0 0;font-size:56px;font-weight:500;line-height:1.35;color:var(--ink2);max-width:1500px;text-wrap:balance}
.content{position:relative;flex:1 1 auto;min-height:0;margin-top:56px}
.chips{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap}
.chip{font-size:32px;font-weight:700;padding:8px 24px;border:2px solid var(--line);border-radius:999px;color:var(--ink2)}

/* עיקרון */
.principle{justify-content:center}
.principle .h{font-size:120px;line-height:1.1;max-width:1600px}
.tone-citron{background:var(--citron);color:var(--deep)}
.tone-citron .kicker{color:var(--deep)}
.tone-citron .sub{color:#1E3A42}
.tone-citron .foot{color:#1E3A42;border-color:rgba(12,40,49,.25)}

/* נקודות */
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:44px}
.points li{display:flex;gap:36px;align-items:flex-start;font-size:64px;font-weight:500;line-height:1.3}
.points .mk{flex:0 0 auto;width:84px;height:84px;border-radius:50%;background:var(--citron);color:var(--deep);font-size:46px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:2px}
.points .dot{flex:0 0 auto;width:28px;height:28px;border-radius:6px;background:var(--citron);margin-top:30px}
.pfoot{position:absolute;bottom:0;right:0;font-size:44px;color:var(--ink2)}

/* משימה */
.task{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:96px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:34px}
.steps li{display:flex;gap:30px;align-items:flex-start;font-size:58px;font-weight:500;line-height:1.28}
.steps .mk{flex:0 0 auto;width:76px;height:76px;border-radius:50%;background:var(--citron);color:var(--deep);font-size:42px;font-weight:900;display:flex;align-items:center;justify-content:center}
.timer{display:flex;flex-direction:column;align-items:center;gap:18px}
.ring{position:relative;width:400px;height:400px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--line);stroke-width:22}
.ring .fg{fill:none;stroke:var(--citron);stroke-width:22;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.tlabel{font-size:32px;color:var(--cap);font-weight:500}
.timer.done .ring .t{color:var(--citron);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ברקוד */
.qrwrap{display:grid;grid-template-columns:minmax(0,1fr) 640px;gap:112px;align-items:center;flex:1 1 auto;min-height:0}
.qrtile{width:640px;height:640px;background:#fff;border-radius:36px;padding:44px}
.qrtile svg{display:block;width:100%;height:100%}
.qrurl{margin-top:34px;font-size:40px;color:var(--cap);direction:ltr;text-align:right;word-break:break-all}
.missing{border:6px dashed var(--citron);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;color:var(--citron)}
.missing b{font-size:52px;font-weight:900}
.missing span{font-size:30px;color:var(--ink2)}

/* סקר */
.poll{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:96px;align-items:start}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.opt{background:var(--card);border:2px solid #2B5562;border-radius:28px;padding:30px 36px;font-size:50px;font-weight:700;line-height:1.25;display:flex;gap:24px;align-items:center}
.opt i{font-style:normal;flex:0 0 auto;width:64px;height:64px;border-radius:16px;background:var(--citron);color:var(--deep);font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center}
.poll .qrtile{width:380px;height:380px;padding:28px;border-radius:28px}
.qrcap{font-size:34px;color:var(--ink2);margin-top:20px;text-align:center}

/* דוגמאות */
.ex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.excard{background:var(--card);border:2px solid #2B5562;border-radius:28px;padding:26px 36px;display:flex;flex-direction:column;gap:10px}
.excard h3{margin:0;font-size:44px;font-weight:800;color:var(--citron);line-height:1.2}
.excard p{margin:0;font-size:38px;line-height:1.35}
.excard p small{font-size:30px;color:var(--cap);font-weight:700;margin-inline-end:12px}

/* שיר */
.lyrics{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;height:100%;text-align:center}
.lyrics p{margin:0;font-size:80px;font-weight:700;line-height:1.3;text-wrap:balance}
.lyrics p.ph{color:var(--cap);font-weight:500}
.mediahint{position:absolute;bottom:0;left:0;font-size:32px;color:var(--cap)}

/* מעבר לחלון אחר */
.ext{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1 1 auto;gap:26px}
.ext .tool{font-size:130px;font-weight:900;color:var(--citron);line-height:1}
.ext .what{font-size:64px;font-weight:700;line-height:1.25;max-width:1500px;text-wrap:balance}
.ext .what2{font-size:44px;color:var(--ink2);max-width:1400px}
.keys{display:flex;gap:40px;margin-top:20px;font-size:34px;color:var(--ink2);align-items:center}
.kb{display:inline-block;min-width:64px;padding:6px 16px;border:2px solid var(--cap);border-bottom-width:5px;border-radius:12px;font-weight:800;color:var(--paper);text-align:center;direction:ltr;margin-inline-end:12px}

/* פתיחה */
.cover{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:96px;align-items:center;flex:1 1 auto}
.ctext{display:flex;flex-direction:column;align-items:flex-start}
.logos{display:flex;align-items:center;gap:48px}
.logos .x{font-size:64px;color:var(--citron);font-weight:400}
.logos img{height:150px;width:auto;display:block}
.logos svg{height:60px;width:auto;display:block}
.cover h1{margin:56px 0 0;font-size:150px;font-weight:900;line-height:1.02;letter-spacing:-2px}
.cover h1 em{font-style:normal;color:var(--citron)}
.cover .sub{margin-top:24px;color:var(--ink2)}
.ticket{margin-top:56px;background:var(--citron);color:var(--deep);border-radius:32px;padding:28px 52px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;line-height:1}
.ticket .t1{font-size:64px;font-weight:900}
.ticket .t2{font-size:46px;font-weight:800;display:flex;align-items:center;gap:12px}

/* הגרלה */
.draw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px}
.draw .lbl{font-size:56px;color:var(--ink2);font-weight:700}
.draw .num{font-size:420px;font-weight:900;line-height:.95;color:var(--citron);font-variant-numeric:tabular-nums}
.draw .num.rolling{color:var(--ink2)}
.drawn{display:flex;gap:20px;margin-top:20px}
.drawn span{font-size:40px;font-weight:800;padding:8px 28px;border-radius:999px;background:var(--card)}

/* תוכן מוטמע */
.embed{position:absolute;inset:0}
.embed .bar{position:absolute;top:0;right:0;left:0;height:132px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;background:var(--bg);border-bottom:1px solid var(--line)}
.embed .bar h2{margin:0;font-size:56px;font-weight:800}
.embed .bar .mini{display:flex;align-items:center;gap:22px;font-size:28px;color:var(--cap)}
.embed .bar .mini .q{width:104px;height:104px;background:#fff;border-radius:12px;padding:8px}
.embed .bar .mini .q svg{width:100%;height:100%;display:block}
.embed .frame{position:absolute;top:132px;right:0;left:0;bottom:0;background:var(--card)}
.embed .frame .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;font-size:44px;color:var(--ink2)}
.embed .frame .fallback b{font-size:64px;color:var(--paper)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.embed video{position:absolute;inset:0;width:100%;height:100%;background:#000}

/* כותרת תחתונה */
.foot{position:absolute;bottom:0;right:0;left:0;height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 112px;border-top:1px solid var(--line);font-size:30px;color:var(--cap)}
.foot .dots{display:flex;gap:12px}
.foot .dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.foot .dots i.on{background:var(--citron)}
.tone-citron .foot .dots i{background:rgba(12,40,49,.2)}
.tone-citron .foot .dots i.on{background:var(--deep)}
.foot .clock{font-variant-numeric:tabular-nums;direction:ltr}

/* שכבות */
#wallLayer{position:absolute;inset:0;z-index:20}
.ov{position:absolute;inset:0;z-index:40;background:rgba(5,18,23,.94);display:flex;align-items:center;justify-content:center}
#black{position:absolute;inset:0;z-index:60;background:#000}
.ovqr{display:flex;flex-direction:column;align-items:center;gap:30px;text-align:center}
.ovqr .qrtile{width:700px;height:700px}
.ovqr h2{margin:0;font-size:80px;font-weight:900}
.agenda{width:1700px;height:900px;overflow:auto;columns:2;column-gap:64px;font-size:30px}
.agenda section{break-inside:avoid;margin-bottom:26px}
.agenda h3{margin:0 0 8px;font-size:34px;color:var(--citron)}
.agenda button{display:block;width:100%;text-align:right;background:none;border:0;color:var(--paper);font-size:30px;padding:6px 14px;border-radius:10px;cursor:pointer}
.agenda button.cur{background:var(--citron);color:var(--deep);font-weight:800}
.agenda button:hover{background:var(--card)}
.help{display:grid;grid-template-columns:auto auto auto auto;gap:26px 36px;font-size:38px;align-items:center;max-width:1600px}
.help h2{grid-column:1/-1;margin:0 0 10px;font-size:64px}

/* איורים ותנועה: אותו סגנון איור כמו ב-PDF ובפלייר, ותנועה עדינה שלא מתחרה בדיבור */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
.art{position:relative}
.art img{display:block;width:100%;height:auto;border-radius:40px}
.art.dark img{background:#113640}
.art.light img{background:#F1F3F2}
.art .sp{position:absolute;display:block;background:var(--citron);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.art .s1{width:40px;height:40px;top:-20px;left:-14px}
.art .s2{width:24px;height:24px;top:30%;right:-30px}
.art .s3{width:30px;height:30px;bottom:-16px;left:34%}
.tone-citron .art .sp{background:var(--deep)}
.tone-accent .h{color:var(--citron)}
.hart{position:absolute;top:80px;left:112px;width:290px;z-index:1}
.hashart .h,.hashart .sub{max-width:1260px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 540px;gap:100px;align-items:center}
.withart .h{font-size:104px}
.pgrid2{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:96px;align-items:start}
.qart{width:240px;margin-top:36px}
.eart{width:260px}
.cart{width:600px}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(-4deg)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes twinkle{0%,100%{transform:scale(.35) rotate(0);opacity:.35}50%{transform:scale(1) rotate(20deg);opacity:1}}
@keyframes breathe{50%{transform:scale(1.03)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.anim>.slide{animation:fadein .35s ease both}
.anim .kicker{animation:rise .5s var(--ease) both}
.anim .h,.anim .cover h1{animation:rise .6s var(--ease) .06s both}
.anim .sub,.anim .chips,.anim .qrurl{animation:rise .6s var(--ease) .14s both}
.anim .steps li,.anim .points li,.anim .opt,.anim .excard,.anim .lyrics p{animation:rise .55s var(--ease) both;animation-delay:calc(.22s + var(--n,0) * .09s)}
.anim .art{animation:pop .75s var(--spring) .12s both}
.anim .art img{animation:float 6s ease-in-out .9s infinite}
.anim .art .sp{animation:twinkle 2.6s ease-in-out infinite}
.anim .art .s2{animation-delay:.9s}
.anim .art .s3{animation-delay:1.7s}
.anim .qrtile,.anim .ext .tool,.anim .ticket,.anim .logos{animation:pop .65s var(--spring) .2s both}
.anim .timer{animation:rise .6s var(--ease) .3s both}
.timer.running .ring{animation:breathe 2.4s ease-in-out infinite}
.num.pop{animation:pop .5s var(--spring)}
@media (prefers-reduced-motion:reduce){.anim *,.anim>.slide,.timer.running .ring,.num.pop{animation:none!important}}

/* מסך החזרה */
.rv{position:fixed;inset:0;overflow:auto;background:var(--deep);color:var(--paper);padding:20px max(16px,3vw) 48px;font-size:17px;line-height:1.55}
.rv h1{margin:0;font-size:26px;font-weight:900;line-height:1.2}
.rv h2{margin:0 0 10px;font-size:20px;font-weight:800;color:var(--citron)}
.rv h3{margin:0;font-size:24px;font-weight:900}
.rv p{margin:0 0 8px}
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rv-top small{display:block;color:var(--cap);font-size:15px;font-weight:500}
.rv-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rv-btn{min-height:44px;padding:8px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--paper);font-size:16px;font-weight:700;cursor:pointer}
.rv-btn.pri{background:var(--citron);border-color:var(--citron);color:var(--deep)}
.rv-btn:focus-visible,.rv-tabs button:focus-visible,.tri button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.rv-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rv-tabs button{min-height:44px;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--paper);font-size:16px;font-weight:700;cursor:pointer}
.rv-tabs button[aria-selected="true"]{background:var(--citron);color:var(--deep);border-color:var(--citron)}
.rv-card{background:var(--card);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.rv-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.rv-grid{grid-template-columns:1fr}}
.rv ol.guide{margin:0;padding-inline-start:22px}
.rv ol.guide li{margin-bottom:8px}
.rv label.cb{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rv label.cb input{width:22px;height:22px;margin-top:3px;accent-color:var(--citron);flex:0 0 auto}
.chk{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.chk .lbl{flex:1 1 auto;min-width:0}
.tri{display:flex;gap:6px;flex:0 0 auto}
.tri button{min-height:40px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--paper);font-size:15px;font-weight:700;cursor:pointer}
.tri button.on-ok{background:var(--citron);color:var(--deep);border-color:var(--citron)}
.tri button.on-fix{background:#E8C547;color:#1d1803;border-color:#E8C547}
.tri button.on-fail{background:#E2745A;color:#1a0b06;border-color:#E2745A}
.rv textarea{width:100%;min-height:90px;background:#0A2129;color:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical}
.rv-big{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.rv-stat{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin:6px 0 12px;color:var(--ink2)}
.rv-chip{display:inline-block;font-size:14px;font-weight:800;padding:3px 12px;border-radius:999px;background:#0A2129;color:var(--ink2)}
.rv-chip.ok{background:var(--citron);color:var(--deep)}
.rv-chip.late{background:#E2745A;color:#1a0b06}
.rv-chip.fix{background:#E8C547;color:#1d1803}
.rv-steps{margin:0;padding-inline-start:20px}
.rv-steps li{margin-bottom:8px}
.rv-steps small{display:block;color:var(--cap)}
.rv-tw{overflow-x:auto}
table.rv-t{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.rv-t th,.rv-t td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
.rv-t th{color:var(--cap);font-weight:700}
.rv-t td.n{font-variant-numeric:tabular-nums}
.rv-t tr.cur td{background:#0A2129}
.rv-t button{background:none;border:0;color:var(--paper);font:inherit;font-weight:700;cursor:pointer;text-align:right;padding:0;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.rv pre{white-space:pre-wrap;background:#0A2129;border-radius:12px;padding:14px 16px;font:inherit;font-size:15px;margin:0 0 12px;max-height:60vh;overflow:auto}
.rv-miss{background:#3a2a12;border-radius:12px;padding:10px 14px}

/* מסך המנחה */
.pv{position:fixed;inset:0;overflow:auto;background:var(--deep);color:var(--paper);padding:20px 24px;display:flex;flex-direction:column;gap:16px;font-size:16px}
.pv-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pv-seg{font-size:22px;font-weight:800}
.pv-seg small{display:block;font-size:15px;color:var(--cap);font-weight:500}
.pv-clock{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr}
.pv-status{font-size:16px;font-weight:800;padding:6px 14px;border-radius:999px;background:var(--card)}
.pv-status.late{background:#E2745A;color:#1a0b06}
.pv-status.ok{background:var(--citron);color:var(--deep)}
.pv-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.pv-card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pv-card h4{margin:0;font-size:14px;color:var(--cap);font-weight:700}
.pv-card .tt{font-size:22px;font-weight:800;line-height:1.25}
.thumb{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#000}
.thumb .tstage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;pointer-events:none}
.note{font-size:18px;line-height:1.5;margin:0}
.note b{color:var(--citron)}
.pv-ctrls{display:flex;gap:10px;flex-wrap:wrap}
.pv-ctrls button{min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--paper);font-size:17px;font-weight:700;cursor:pointer}
.pv-ctrls button.big{background:var(--citron);color:var(--deep);border-color:var(--citron);font-size:20px;padding:10px 34px}
.pv-ctrls button:focus-visible,.agenda button:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.pv-timer{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;min-width:96px;text-align:center}
.pv-list{columns:2;column-gap:24px}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };
