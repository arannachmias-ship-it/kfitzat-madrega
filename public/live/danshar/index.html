const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link = u => { if (!u) return ''; if (u[0] === '@') return L.links[u.slice(1)] || ''; return u; };
const linkName = u => (u && u[0] === '@') ? u.slice(1) : '';
const NAMES = { companion:'הדף המלווה', wall:'קיר Padlet', app:'האפליקציה', appScreen:'דף המקרן של האפליקציה', predict:'טופס הניבוי', survey:'הסקר', closing:'טופס הסיום', anthem:'קובץ ההמנון', film:'סרט הסיום', video:'כלי הווידאו', claude:'Claude', gemini:'Gemini' };
const shortUrl = u => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
function qrSvg(text){ try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch(e){ return ''; } }
function padletEmbed(u){
  // קישור רגיל של Padlet הופך לקישור הטמעה
  const m = u.match(/^https?:\/\/(?:www\.)?padlet\.com\/(?!embed\/)[^\/]+\/[^\/?#]*?-?([a-z0-9]{10,})(?:[?#].*)?$/i);
  return m ? 'https://padlet.com/embed/' + m[1] : u;
}
function qrTile(u, extraClass){
  const url = link(u);
  if (!url) return `<div class="qrtile missing ${extraClass||''}"><b>חסר קישור</b><span>${esc(NAMES[linkName(u)] || linkName(u) || 'קישור')}</span></div>`;
  return `<div class="qrtile ${extraClass||''}">${qrSvg(url)}</div>`;
}

/* ---------- מצב ---------- */
const S = { i:0, black:false, ov:null, wallOv:false, clockStart:null, timer:{ total:0, left:0, running:false, last:0, done:false }, draw:{ cur:null, rolling:false, list:[], used:[] } };
try { const saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved){ S.i = Math.min(saved.i|0, STEPS.length-1); S.clockStart = saved.clockStart || null; } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ i:S.i, clockStart:S.clockStart })); } catch(e){} }

/* ---------- ציור שקף ---------- */
function footer(st){
  const seg = L.segments[st.seg];
  const dots = seg.steps.map((_, k) => `<i class="${k === st.k ? 'on' : ''}"></i>`).join('');
  const mins = seg.from < 0 ? 'לפני ההתחלה' : `דקות ${seg.from}–${seg.to}`;
  return `<div class="foot"><span>${esc(seg.title)} · ${mins}</span><span class="dots">${dots}</span><span class="clock" data-clock>00:00</span></div>`;
}
function head(st){
  return (st.kicker ? `<p class="kicker">${esc(st.kicker)}</p>` : '') + (st.title ? `<h2 class="h">${esc(st.title)}</h2>` : '');
}
function renderStep(st, thumb){
  const t = st.type;
  const hart = st.art && ['task','poll','song','draw','examples'].includes(t) ? artHtml(st.art, 'hart') : '';
  const hcls = hart ? ' hashart' : '';
  if (t === 'cover'){
    const logo = L.clientLogo && L.clientLogo.indexOf('__') !== 0 ? `<img src="${L.clientLogo}" alt="${esc(L.client)}">` : `<b style="font-size:72px">${esc(L.client)}</b>`;
    const ti = esc(L.title).replace(' לכל אחד', '<br><em>לכל אחד</em>');
    const info = L.info || [], l1 = info.slice(0, 2).join(' · '), l2 = info.slice(2).join(' · ');
    return `<div class="slide" style="padding:96px 112px"><div class="cover"><div class="ctext"><div class="logos">${logo}<span class="x" aria-hidden="true">×</span>${NX_LOGO}</div><h1>${ti}</h1><p class="sub">${esc(L.audience)}</p><div class="ticket"><span class="t1">${esc(l1)}</span>${l2 ? `<span class="t2">${PIN}${esc(l2)}</span>` : ''}</div></div>${artHtml(L.coverArt || 'team', 'cart')}</div></div>`;
  }
  if (t === 'principle'){
    const tone = st.tone === 'citron' ? (st.art ? 'tone-accent' : 'tone-citron') : '';
    const text = (st.kicker ? `<p class="kicker">${esc(st.kicker)}</p>` : '') + `<h2 class="h">${esc(st.title)}</h2>` + (st.sub ? `<p class="sub">${esc(st.sub)}</p>` : '');
    const a = st.art ? artHtml(st.art) : '';
    return `<div class="slide principle ${tone}${a ? ' withart' : ''}">${a ? `<div class="pgrid"><div>${text}</div>${a}</div>` : text}${footer(st)}</div>`;
  }
  if (t === 'points'){
    const items = st.points.map((p, n) => `<li style="--n:${n}">${st.numbered ? `<span class="mk">${n+1}</span>` : '<span class="dot"></span>'}<span>${esc(p)}</span></li>`).join('');
    const list = `<ul class="points">${items}</ul>`, a = st.art ? artHtml(st.art) : '';
    return `<div class="slide">${head(st)}<div class="content">${a ? `<div class="pgrid2">${list}${a}</div>` : list}${st.foot ? `<p class="pfoot">${esc(st.foot)}</p>` : ''}</div>${footer(st)}</div>`;
  }
  if (t === 'task'){
    const items = st.steps.map((p, n) => `<li style="--n:${n}"><span class="mk">${n+1}</span><span>${esc(p)}</span></li>`).join('');
    const chips = (st.tools || []).length ? `<div class="chips">${st.tools.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '';
    const C = 2 * Math.PI * 190;
    const timer = st.minutes ? `<div class="timer" data-timer><div class="ring"><svg viewBox="0 0 440 440" aria-hidden="true"><circle class="bg" cx="220" cy="220" r="190"></circle><circle class="fg" cx="220" cy="220" r="190" stroke-dasharray="${C}" stroke-dashoffset="0" data-ring></circle></svg><div class="t" data-ttext>${fmt(st.minutes*60)}</div></div><div class="tlabel" data-tlabel>T · מפעילים את הטיימר</div></div>` : '<div></div>';
    return `<div class="slide${hcls}">${hart}${head(st)}${chips}<div class="content"><div class="task"><ol class="steps">${items}</ol>${timer}</div></div>${footer(st)}</div>`;
  }
  if (t === 'qr'){
    const url = link(st.url);
    return `<div class="slide"><div class="qrwrap"><div>${head(st)}${st.sub ? `<p class="sub">${esc(st.sub)}</p>` : ''}${url ? `<p class="qrurl">${esc(shortUrl(url))}</p>` : ''}${st.art ? artHtml(st.art, 'qart') : ''}</div>${qrTile(st.url)}</div>${footer(st)}</div>`;
  }
  if (t === 'poll'){
    const letters = 'אבגדהוזח';
    const opts = st.options.map((o, n) => `<div class="opt" style="--n:${n}"><i>${letters[n]}</i><span>${esc(o)}</span></div>`).join('');
    return `<div class="slide${hcls}">${hart}${head(st)}<div class="content"><div class="poll"><div class="opts">${opts}</div><div>${qrTile(st.url)}<p class="qrcap">סורקים ועונים</p></div></div></div>${footer(st)}</div>`;
  }
  if (t === 'examples'){
    const cards = st.items.map((it, n) => `<div class="excard" style="--n:${n}"><h3>${esc(it.role)}</h3><p><small>הכלי, מהר:</small>${esc(it.fast)}</p><p><small>רק אתם יודעים:</small>${esc(it.you)}</p></div>`).join('');
    return `<div class="slide${hcls}">${hart}${head(st)}<div class="content"><div class="ex">${cards}</div></div>${footer(st)}</div>`;
  }
  if (t === 'song'){
    const src = link(st.src);
    const lines = st.lines.map((x, n) => `<p class="${/^\[/.test(x) ? 'ph' : ''}" style="--n:${n}">${esc(x)}</p>`).join('');
    const audio = (!thumb && src) ? `<audio data-media src="${esc(src)}" preload="auto"></audio>` : '';
    return `<div class="slide${hcls}">${hart}${head(st)}<div class="content"><div class="lyrics">${lines}</div>${audio}<p class="mediahint">${src ? '<span class="kb">רווח</span>מנגנים / עוצרים' : 'חסר קובץ השיר'}</p></div>${footer(st)}</div>`;
  }
  if (t === 'external'){
    const url = link(st.url);
    return `<div class="slide"><div class="ext">${st.art ? artHtml(st.art, 'eart') : ''}${st.kicker ? `<p class="kicker">${esc(st.kicker)}</p>` : ''}<div class="tool">${esc(st.tool)}</div><div class="what">${esc(st.title)}</div>${st.sub ? `<div class="what2">${esc(st.sub)}</div>` : ''}<div class="keys">${url ? '<span><span class="kb">O</span>פותחים בחלון חדש</span>' : '<span>חסר קישור</span>'}<span><span class="kb">Alt+Tab</span>חוזרים לכאן</span></div></div>${footer(st)}</div>`;
  }
  if (t === 'draw'){
    return `<div class="slide${hcls}">${hart}${head(st)}<div class="content"><div class="draw"><div class="lbl">שולחן</div><div class="num" data-drawnum>?</div><div class="drawn" data-drawn></div><p class="tlabel"><span class="kb">D</span>מגרילים</p></div></div>${footer(st)}</div>`;
  }
  if (t === 'wall' || t === 'embed' || t === 'video'){
    if (t === 'wall' && !thumb) return `<div class="slide" style="background:var(--bg)"></div>`; // הקיר עצמו בשכבה קבועה, כדי שלא ייטען מחדש
    return embedHtml(st, thumb);
  }
  return `<div class="slide">${head(st)}${footer(st)}</div>`;
}
function embedHtml(st, thumb){
  const t = st.type;
  const raw = t === 'video' ? link(st.src) : link(st.url);
  const url = t === 'wall' && raw ? padletEmbed(raw) : raw;
  const q = (t !== 'video' && raw) ? `<div class="mini"><span>${esc(shortUrl(link(st.url)))}</span><div class="q">${qrSvg(link(st.url))}</div></div>` : '';
  let inner;
  if (!url) inner = `<div class="fallback"><b>חסר קישור</b><span>${esc(NAMES[linkName(t === 'video' ? st.src : st.url)] || '')}</span></div>`;
  else if (thumb) inner = `<div class="fallback"><b>${t === 'wall' ? 'הקיר' : t === 'video' ? 'סרטון' : 'תוכן מוטמע'}</b><span>${esc(shortUrl(raw))}</span></div>`;
  else if (t === 'video') inner = `<video data-media src="${esc(url)}" playsinline></video>`;
  else inner = `<div class="fallback"><b>הדף לא נטען כאן?</b><span><span class="kb">O</span>פותחים אותו בחלון חדש</span></div><iframe src="${esc(url)}" title="${esc(st.title || '')}" allow="autoplay; clipboard-write; fullscreen" loading="eager"></iframe>`;
  return `<div class="embed"><div class="bar"><h2>${esc(st.title || '')}</h2>${q}</div><div class="frame">${inner}</div></div>`;
}

/* ---------- המסך הראשי ---------- */
let stage, wallLayer, ovLayer, blackLayer; const subs = new Set();
function fit(){
  const w = innerWidth, h = innerHeight, s = Math.min(w/1920, h/1080);
  stage.style.transform = `translate(${(w - 1920*s)/2}px, ${(h - 1080*s)/2}px) scale(${s})`;
}
function enter(){
  const st = STEPS[S.i];
  stage.querySelector('#slide').innerHTML = renderStep(st, false);
  // טיימר חדש לכל שלב
  S.timer = { total: (st.minutes||0)*60, left: (st.minutes||0)*60, running: !!st.autostart, last: performance.now(), done:false };
  S.draw.cur = null; S.draw.list = [];
  updateWall(); paintTimer(); paintDraw(); paintClock(); save(); push();
}
function go(n){
  const j = Math.max(0, Math.min(STEPS.length-1, n));
  if (j === S.i) return;
  if (S.clockStart == null && STEPS[S.i].type === 'cover' && j > S.i) S.clockStart = Date.now();
  S.i = j; S.ov = null; S.wallOv = false; drawOv(); enter();
}
const next = () => go(S.i + 1), prev = () => go(S.i - 1);

function updateWall(){
  const st = STEPS[S.i];
  const show = st.type === 'wall' || S.wallOv;
  const wallUrl = link(st.type === 'wall' ? st.url : '@wall');
  if (show){
    const title = st.type === 'wall' ? st.title : 'הקיר';
    if (!wallLayer.dataset.url || wallLayer.dataset.url !== wallUrl){
      wallLayer.innerHTML = embedHtml({ type:'wall', title, url: st.type === 'wall' ? st.url : '@wall' }, false);
      wallLayer.dataset.url = wallUrl;
    } else {
      const h = wallLayer.querySelector('.bar h2'); if (h) h.textContent = title;
    }
  }
  wallLayer.hidden = !show;
}
function fmt(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
function paintTimer(){
  const T = S.timer, root = stage.querySelector('[data-timer]');
  if (!root) return;
  root.querySelector('[data-ttext]').textContent = fmt(T.left);
  const C = 2 * Math.PI * 190, ring = root.querySelector('[data-ring]');
  ring.style.strokeDashoffset = T.total ? C * (1 - T.left / T.total) : 0;
  root.classList.toggle('done', T.done);
  root.classList.toggle('running', T.running);
  root.querySelector('[data-tlabel]').textContent = T.done ? 'הזמן נגמר' : T.running ? 'T · עוצרים' : (T.left < T.total ? 'T · ממשיכים' : 'T · מפעילים את הטיימר');
}
function chime(){
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((f, n) => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = f; o.connect(g); g.connect(A.destination); const t0 = A.currentTime + n*0.28; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.6); o.start(t0); o.stop(t0+0.65); });
  } catch(e){}
}
function toggleTimer(){ const T = S.timer; if (!T.total) return; if (T.done){ resetTimer(); return; } T.running = !T.running; T.last = performance.now(); paintTimer(); push(); }
function resetTimer(){ const T = S.timer; T.left = T.total; T.running = false; T.done = false; paintTimer(); push(); }
function tick(){
  const T = S.timer, now = performance.now();
  if (T.running){ T.left -= (now - T.last)/1000; if (T.left <= 0){ T.left = 0; T.running = false; T.done = true; chime(); } paintTimer(); }
  T.last = now; paintClock();
}
function elapsed(){ return S.clockStart ? Math.floor((Date.now() - S.clockStart)/1000) : 0; }
function hms(sec){ const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h ? h + ':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
function paintClock(){ const el = stage.querySelector('[data-clock]'); if (el) el.textContent = S.clockStart ? hms(elapsed()) : 'S · מתחילים שעון'; }

/* הגרלת שולחנות */
function drawTable(){
  const n = L.tables || 6; if (S.draw.rolling) return;
  let pool = []; for (let k=1; k<=n; k++) if (!S.draw.used.includes(k)) pool.push(k);
  if (!pool.length){ S.draw.used = []; for (let k=1; k<=n; k++) pool.push(k); }
  const pick = pool[Math.floor(Math.random()*pool.length)];
  if (STEPS[S.i].type !== 'draw'){ S.ov = 'draw'; drawOv(); }
  S.draw.rolling = true; const t0 = performance.now();
  (function roll(){
    const el = document.querySelector(S.ov === 'draw' ? '#ov [data-drawnum]' : '#stage [data-drawnum]');
    if (performance.now() - t0 < 1100){ if (el){ el.textContent = 1 + Math.floor(Math.random()*n); el.classList.add('rolling'); } requestAnimationFrame(roll); return; }
    S.draw.rolling = false; S.draw.cur = pick; S.draw.used.push(pick); S.draw.list.push(pick); paintDraw(); push();
  })();
}
function paintDraw(){
  document.querySelectorAll('[data-drawnum]').forEach(el => { el.textContent = S.draw.cur == null ? '?' : S.draw.cur; el.classList.remove('rolling'); if (S.draw.cur != null){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } });
  document.querySelectorAll('[data-drawn]').forEach(el => { el.innerHTML = S.draw.list.slice(0, -1).map(x => `<span>שולחן ${x}</span>`).join(''); });
}

/* שכבות */
function drawOv(){
  if (!S.ov){ ovLayer.hidden = true; ovLayer.innerHTML = ''; return; }
  ovLayer.hidden = false;
  if (S.ov === 'qr'){
    const u = link('@companion');
    ovLayer.innerHTML = `<div class="ovqr"><h2>הדף המלווה</h2>${qrTile('@companion')}${u ? `<p class="qrurl" style="text-align:center">${esc(shortUrl(u))}</p>` : ''}</div>`;
  } else if (S.ov === 'agenda'){
    ovLayer.innerHTML = `<div class="agenda">${agendaHtml('cur')}</div>`;
    ovLayer.querySelectorAll('button[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
    const c = ovLayer.querySelector('.cur'); if (c) c.focus();
  } else if (S.ov === 'help'){
    const rows = [['→ ← או קליקר','הבא / הקודם'],['T','טיימר: הפעלה ועצירה · R איפוס'],['W','הקיר, מכל מקום'],['Q','הברקוד של הדף המלווה'],['D','הגרלת שולחן'],['O','פתיחה בחלון חדש'],['B','מסך שחור'],['G','כל השלבים'],['P','מסך המנחה בחלון נפרד'],['Y','מצב חזרה: ליווי ומשוב'],['S','הפעלה ועצירה של השעון'],['F','מסך מלא'],['Esc','סגירה']];
    ovLayer.innerHTML = `<div class="help"><h2>מקשים</h2>${rows.map(r => `<span class="kb">${esc(r[0])}</span><span>${esc(r[1])}</span>`).join('')}</div>`;
  } else if (S.ov === 'draw'){
    ovLayer.innerHTML = `<div class="draw"><div class="lbl">שולחן</div><div class="num" data-drawnum>?</div><div class="drawn" data-drawn></div></div>`;
    paintDraw();
  }
}
function agendaHtml(curClass){
  let html = '', idx = 0;
  L.segments.forEach(seg => {
    html += `<section><h3>${esc(seg.title)}${seg.from >= 0 ? ` · ${seg.from}–${seg.to}` : ''}</h3>`;
    seg.steps.forEach(st => { html += `<button type="button" data-go="${idx}" class="${idx === S.i ? curClass : ''}">${esc(stepLabel(st))}</button>`; idx++; });
    html += '</section>';
  });
  return html;
}
function stepLabel(st){
  const kind = { cover:'פתיחה', principle:'עיקרון', points:'נקודות', task:'משימה', qr:'ברקוד', poll:'סקר', examples:'דוגמאות', song:'שיר', external:'חלון אחר', draw:'הגרלה', wall:'קיר', embed:'מוטמע', video:'סרטון' }[st.type] || st.type;
  return kind + ': ' + (st.type === 'cover' ? L.title : (st.title || st.tool || ''));
}
function toggle(name){ S.ov = S.ov === name ? null : name; drawOv(); push(); }
function setBlack(v){ S.black = v; blackLayer.hidden = !S.black; push(); }
function openExternal(){
  const st = STEPS[S.i];
  const u = st.type === 'external' || st.type === 'qr' || st.type === 'poll' || st.type === 'embed' || st.type === 'wall' ? link(st.url) : link('@wall');
  if (u) window.open(u, 'nx-ext');
}
function media(){ const m = stage.querySelector('[data-media]'); if (!m) return false; if (m.paused) m.play().catch(() => {}); else m.pause(); return true; }
function fullscreen(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); }
function openWin(hash, name){
  const w = window.open(location.href.split('#')[0] + hash, name, 'width=1280,height=860');
  if (w) subs.add(w);
  setTimeout(push, 600);
}
const openPresenter = () => openWin('#presenter', 'nx-presenter');
const openRehearsal = () => openWin('#rehearsal', 'nx-rehearsal');

/* פקודות. אותן פקודות מגיעות מהמקלדת, מהקליקר וממסך המנחה */
function cmd(c, arg){
  switch(c){
    case 'next': next(); break; case 'prev': prev(); break; case 'go': go(arg); break;
    case 'timer': toggleTimer(); break; case 'reset': resetTimer(); break;
    case 'wall': S.wallOv = !S.wallOv; updateWall(); push(); break;
    case 'qr': toggle('qr'); break; case 'agenda': toggle('agenda'); break; case 'help': toggle('help'); break;
    case 'draw': drawTable(); break; case 'open': openExternal(); break;
    case 'black': setBlack(!S.black); break; case 'media': media(); break;
    case 'clock': S.clockStart = S.clockStart ? null : Date.now(); save(); paintClock(); push(); break;
    case 'rehearsal': openRehearsal(); break;
    case 'close': if (S.ov){ S.ov = null; drawOv(); } else if (S.wallOv){ S.wallOv = false; updateWall(); } else if (S.black) setBlack(false); push(); break;
  }
}
function onKey(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const st = STEPS[S.i], c = e.code;
  const map = { PageDown:'next', ArrowLeft:'next', ArrowDown:'next', Enter:'next', KeyN:'next', PageUp:'prev', ArrowRight:'prev', ArrowUp:'prev', Backspace:'prev',
    KeyT:'timer', KeyR:'reset', KeyW:'wall', KeyQ:'qr', KeyG:'agenda', KeyH:'help', Slash:'help', KeyD:'draw', KeyO:'open', KeyB:'black', Period:'black', KeyS:'clock', Escape:'close' };
  if (c === 'Space'){ e.preventDefault(); if ((st.type === 'song' || st.type === 'video') && media()) return; cmd('next'); return; }
  if (c === 'KeyF'){ fullscreen(); return; }
  if (c === 'KeyP'){ openPresenter(); return; }
  if (c === 'KeyY'){ openRehearsal(); return; }
  if (c === 'Home'){ go(0); return; } if (c === 'End'){ go(STEPS.length-1); return; }
  if (S.ov === 'agenda' && (c === 'ArrowUp' || c === 'ArrowDown' || c === 'Enter')) return; // ניווט ברשימה
  if (map[c]){ e.preventDefault(); cmd(map[c]); }
}
function stateMsg(){ return { type:'state', i:S.i, black:S.black, ov:S.ov, wallOv:S.wallOv, clockStart:S.clockStart, timer:{ total:S.timer.total, left:S.timer.left, running:S.timer.running, done:S.timer.done }, draw:{ cur:S.draw.cur } }; }
function push(){ const m = stateMsg(); subs.forEach(w => { if (w.closed){ subs.delete(w); return; } try { w.postMessage(m, '*'); } catch(e){} }); }

function bootMain(){
  document.getElementById('vp').hidden = false;
  stage = document.getElementById('stage');
  stage.innerHTML = '<div id="slide" class="anim"></div><div id="wallLayer" hidden></div><div id="ov" class="ov" hidden></div><div id="black" hidden></div>';
  wallLayer = document.getElementById('wallLayer'); ovLayer = document.getElementById('ov'); blackLayer = document.getElementById('black');
  fit(); addEventListener('resize', fit);
  addEventListener('keydown', onKey);
  addEventListener('message', ev => { const d = ev.data || {}; if (d.type === 'hello'){ subs.add(ev.source); push(); } else if (d.type === 'cmd') cmd(d.cmd, d.arg); });
  stage.addEventListener('click', e => { if (e.target.closest('iframe,video,button')) return; if (S.ov){ return; } });
  enter();
  setInterval(() => { tick(); }, 250);
  setInterval(push, 1000);
  if (!sessionStorage.getItem('nx-help-shown')){ try { sessionStorage.setItem('nx-help-shown','1'); } catch(e){} S.ov = 'help'; drawOv(); setTimeout(() => { if (S.ov === 'help'){ S.ov = null; drawOv(); } }, 4000); }
}

/* ---------- מסך המנחה ---------- */
function bootPresenter(){
  document.getElementById('vp').hidden = true;
  const root = document.createElement('div'); root.className = 'pv'; document.body.appendChild(root);
  const main = window.opener;
  let st = null;
  const send = (c, arg) => { if (main && !main.closed) main.postMessage({ type:'cmd', cmd:c, arg }, '*'); };
  if (!main){ root.innerHTML = '<p class="pv-off">את מסך המנחה פותחים מהמסך הראשי, במקש P.<br>ככה שני המסכים מחוברים: מה שלוחצים כאן קורה על המקרן.</p>'; return; }
  main.postMessage({ type:'hello' }, '*');
  const missing = []; const seen = {};
  STEPS.forEach(s => ['url','src'].forEach(k => { const v = s[k]; if (v && v[0] === '@' && !link(v) && !seen[v]){ seen[v] = 1; missing.push(NAMES[v.slice(1)] || v.slice(1)); } }));
  root.innerHTML = `
    <div class="pv-top"><div class="pv-seg" data-seg></div><div class="pv-status" data-status></div><div class="pv-clock" data-pclock>00:00</div></div>
    ${missing.length ? `<div class="pv-miss"><b>חסרים קישורים:</b> ${missing.map(esc).join(' · ')}. מוסיפים אותם בראש הקובץ, ברשימת links.</div>` : ''}
    <div class="pv-ctrls">
      <button type="button" data-c="prev">הקודם</button><button type="button" class="big" data-c="next">הבא</button>
      <button type="button" data-c="timer">טיימר</button><span class="pv-timer" data-ptimer>–</span><button type="button" data-c="reset">איפוס</button>
      <button type="button" data-c="wall">הקיר</button><button type="button" data-c="qr">ברקוד הדף המלווה</button><button type="button" data-c="draw">הגרלה</button>
      <button type="button" data-c="open">פתיחה בחלון</button><button type="button" data-c="media">נגן / עצור</button><button type="button" data-c="black">מסך שחור</button><button type="button" data-c="clock">שעון</button><button type="button" data-c="rehearsal">מצב חזרה</button>
    </div>
    <div class="pv-grid">
      <div class="pv-card"><h4>על המסך עכשיו</h4><div class="thumb" data-tnow><div class="tstage"></div></div><div class="tt" data-ttl></div><p class="note" data-say></p><p class="note" data-do></p></div>
      <div class="pv-card"><h4>הבא</h4><div class="thumb" data-tnext><div class="tstage"></div></div><div class="tt" data-ntl></div><p class="note" data-nsay></p></div>
    </div>
    <div class="pv-card"><h4>כל השלבים</h4><div class="pv-list" data-list></div></div>`;
  root.querySelectorAll('[data-c]').forEach(b => b.onclick = () => send(b.dataset.c));
  function fitThumb(box){ const s = box.clientWidth / 1920; box.firstElementChild.style.transform = `scale(${s})`; }
  addEventListener('resize', () => root.querySelectorAll('.thumb').forEach(fitThumb));
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const map = { PageDown:'next', ArrowLeft:'next', Space:'next', KeyN:'next', PageUp:'prev', ArrowRight:'prev', KeyT:'timer', KeyR:'reset', KeyW:'wall', KeyQ:'qr', KeyD:'draw', KeyO:'open', KeyB:'black', Period:'black', KeyS:'clock', Escape:'close' };
    if (map[e.code]){ e.preventDefault(); send(map[e.code]); }
  });
  let lastI = -1;
  addEventListener('message', ev => {
    const d = ev.data || {}; if (d.type !== 'state') return; st = d;
    const cur = STEPS[d.i], nx = STEPS[d.i+1], seg = L.segments[cur.seg];
    root.querySelector('[data-seg]').innerHTML = `${esc(seg.title)}<small>${seg.from >= 0 ? `דקות ${seg.from}–${seg.to} מתוך 90` : 'לפני ההתחלה'} · שלב ${cur.k+1} מתוך ${seg.steps.length}</small>`;
    const el = d.clockStart ? Math.floor((Date.now() - d.clockStart)/1000) : 0, mins = el/60;
    root.querySelector('[data-pclock]').textContent = d.clockStart ? hms(el) : 'השעון לא רץ';
    const stEl = root.querySelector('[data-status]');
    if (!d.clockStart || seg.from < 0){ stEl.textContent = 'השעון מתחיל כשעוברים את מסך הפתיחה'; stEl.className = 'pv-status'; }
    else if (mins > seg.to){ stEl.textContent = `מאחרים ${Math.ceil(mins - seg.to)} דק'`; stEl.className = 'pv-status late'; }
    else if (mins < seg.from - 1){ stEl.textContent = `מקדימים ${Math.floor(seg.from - mins)} דק'`; stEl.className = 'pv-status ok'; }
    else { stEl.textContent = 'בזמן'; stEl.className = 'pv-status ok'; }
    root.querySelector('[data-ptimer]').textContent = d.timer.total ? (d.timer.done ? 'נגמר' : fmt(d.timer.left)) : '–';
    if (d.i !== lastI){
      lastI = d.i;
      const tn = root.querySelector('[data-tnow] .tstage'); tn.innerHTML = renderStep(cur, true);
      const tx = root.querySelector('[data-tnext] .tstage'); tx.innerHTML = nx ? renderStep(nx, true) : '<div class="slide principle"><h2 class="h">סוף</h2></div>';
      root.querySelectorAll('.thumb').forEach(fitThumb);
      root.querySelector('[data-ttl]').textContent = stepLabel(cur);
      root.querySelector('[data-say]').innerHTML = cur.say ? `<b>אומרים:</b> ${esc(cur.say)}` : '';
      root.querySelector('[data-do]').innerHTML = cur.do ? `<b>עושים:</b> ${esc(cur.do)}` : '';
      root.querySelector('[data-ntl]').textContent = nx ? stepLabel(nx) : '';
      root.querySelector('[data-nsay]').innerHTML = nx && (nx.say || nx.do) ? `<b>אחר כך:</b> ${esc(nx.say || nx.do)}` : '';
      const list = root.querySelector('[data-list]'); list.innerHTML = agendaListHtml(d.i);
      list.querySelectorAll('button[data-go]').forEach(b => b.onclick = () => send('go', +b.dataset.go));
    }
  });
  function agendaListHtml(curI){
    let html = '', idx = 0;
    L.segments.forEach(seg => { html += `<section><h5>${esc(seg.title)}${seg.from >= 0 ? ` · ${seg.from}–${seg.to}` : ''}</h5>`; seg.steps.forEach(s => { html += `<button type="button" data-go="${idx}" class="${idx === curI ? 'cur' : ''}">${esc(stepLabel(s))}</button>`; idx++; }); html += '</section>'; });
    return html;
  }
}


/* ---------- מסך החזרה ---------- */
function bootRehearsal(){
  document.getElementById('vp').hidden = true;
  const RH = L.rehearsal || {}, RK = KEY + '-reh';
  const fresh = () => ({ started:null, ended:null, cur:-1, view:-1, segs:{}, prep:{}, drills:{}, general:'', tab:'before' });
  let R; try { R = JSON.parse(localStorage.getItem(RK) || 'null') || fresh(); } catch(e){ R = fresh(); }
  const saveR = () => { try { localStorage.setItem(RK, JSON.stringify(R)); } catch(e){} };
  const seg = si => (R.segs[si] = R.segs[si] || { total:0, start:null, rating:null, note:'', checks:{} });
  const main = window.opener; let linked = false, mainState = null;
  const send = (c, arg) => { if (main && !main.closed) main.postMessage({ type:'cmd', cmd:c, arg }, '*'); };
  const root = document.createElement('div'); root.className = 'rv'; document.body.appendChild(root);
  const planned = si => { const g = L.segments[si]; return Math.max(0, g.to - g.from); };
  const actual = si => { const s = R.segs[si]; if (!s) return 0; return s.total + (s.start && R.started && !R.ended ? Date.now() - s.start : 0); };
  const mins = ms => Math.round(ms / 6000) / 10;
  const RATE = { ok:'עבד', fix:'צריך תיקון', bad:'לא עבד' };
  const missing = []; const seen = {};
  STEPS.forEach(s => ['url','src'].forEach(k => { const v = s[k]; if (v && v[0] === '@' && !link(v) && !seen[v]){ seen[v] = 1; missing.push(NAMES[v.slice(1)] || v.slice(1)); } }));

  function moveTo(si){
    if (R.cur === si) return;
    const t = Date.now();
    if (R.started && !R.ended && R.cur >= 0){ const s = seg(R.cur); if (s.start){ s.total += t - s.start; s.start = null; } }
    R.cur = si; if (R.view < 0 || R.view === R.prevCur) R.view = si; R.prevCur = si;
    if (R.started && !R.ended) seg(si).start = t;
    saveR(); if (R.tab === 'during') renderTab();
  }
  function startRun(){ R.started = Date.now(); R.ended = null; if (R.cur < 0) R.cur = 0; R.view = R.cur; R.prevCur = R.cur; Object.keys(R.segs).forEach(k => { R.segs[k].total = 0; R.segs[k].start = null; }); seg(R.cur).start = Date.now(); R.tab = 'during'; saveR(); render(); }
  function endRun(){ if (!R.started || R.ended) return; const t = Date.now(); if (R.cur >= 0){ const s = seg(R.cur); if (s.start){ s.total += t - s.start; s.start = null; } } R.ended = t; R.tab = 'summary'; saveR(); render(); }
  let armReset = false;
  function resetRun(btn){ if (!armReset){ armReset = true; btn.textContent = 'בטוח? לחיצה נוספת מוחקת את כל הסימונים'; setTimeout(() => { armReset = false; render(); }, 4000); return; } R = fresh(); saveR(); armReset = false; render(); }

  function header(){
    const status = linked ? '<span class="rv-chip ok">מחובר למסך הראשי</span>' : '<span class="rv-chip">לא מחובר: בוחרים מקטע ידנית</span>';
    const run = !R.started ? '<button type="button" class="rv-btn pri" data-a="start">מתחילים את החזרה</button>'
      : !R.ended ? '<button type="button" class="rv-btn pri" data-a="end">סיימנו את הריצה</button>'
      : '<button type="button" class="rv-btn" data-a="start">ריצה חוזרת (המדידה מתאפסת)</button>';
    const tabs = [['before','1 · לפני'],['during','2 · בזמן הריצה'],['drills','3 · תרגול תקלות'],['summary','4 · סיכום ותיקונים']]
      .map(([k, t]) => `<button type="button" role="tab" aria-selected="${R.tab === k}" data-tab="${k}">${t}</button>`).join('');
    return `<div class="rv-top"><div><h1>חזרה בבית · ${esc(L.title)}</h1><small>${esc(L.client)} · ${esc((L.info || []).join(' · '))} · ארן ומתי</small></div><div class="rv-row">${status}${run}</div></div><div class="rv-tabs" role="tablist">${tabs}</div>`;
  }
  function tabBefore(){
    const guide = (RH.guide || []).map(g => `<li>${esc(g)}</li>`).join('');
    const prep = (RH.prep || []).map((p, i) => `<label class="cb"><input type="checkbox" data-prep="${i}" ${R.prep[i] ? 'checked' : ''}><span>${esc(p)}</span></label>`).join('');
    const nChecks = L.segments.reduce((a, g) => a + (g.checks || []).length, 0);
    return `<div class="rv-grid"><div><div class="rv-card"><h2>איך עושים את החזרה</h2><ol class="guide">${guide}</ol></div>
      <div class="rv-card"><h2>מה בודקים בדרך</h2><p>${L.segments.length} מקטעים, ${STEPS.length} שלבים על המסך ו-${nChecks} בדיקות. בכל מקטע מסמנים כל בדיקה "עבד" או "נכשל", נותנים ציון למקטע, וכותבים מה לתקן.</p>
      <p>המסך הראשי נפתח מקובץ המלווה. מקש Y שם פותח את המסך הזה מחובר אליו. אם המסך הזה פתוח לבד, בוחרים מקטע מהטבלה בלשונית "בזמן הריצה".</p></div></div>
      <div><div class="rv-card"><h2>הכנה, שעה לפני</h2>${prep}</div>
      ${missing.length ? `<div class="rv-card rv-miss"><b>חסרים קישורים במלווה:</b> ${missing.map(esc).join(' · ')}</div>` : '<div class="rv-card"><span class="rv-chip ok">כל הקישורים במלווה מלאים</span></div>'}</div></div>`;
  }
  function tri(attr, val, opts){ return `<div class="tri">${opts.map(([k, t, cls]) => `<button type="button" ${attr}="${k}" class="${val === k ? cls : ''}" aria-pressed="${val === k}">${t}</button>`).join('')}</div>`; }
  function tabDuring(){
    const si = R.view >= 0 ? R.view : Math.max(0, R.cur), g = L.segments[si], s = seg(si);
    const steps = g.steps.map(st => `<li>${esc(stepLabel(st))}${st.say || st.do ? `<small>${esc([st.say, st.do].filter(Boolean).join(' · '))}</small>` : ''}</li>`).join('');
    const checks = (g.checks || []).map((c, ci) => `<div class="chk"><span class="lbl">${esc(c)}</span>${tri('data-chk-' + ci, s.checks[ci], [['ok','עבד','on-ok'],['fail','נכשל','on-fail']])}</div>`).join('') || '<p>אין בדיקות למקטע הזה.</p>';
    const a = actual(si), pl = planned(si), over = a - pl * 60000;
    const live = R.started && !R.ended && si === R.cur;
    const chip = !R.started ? '' : over > 60000 ? `<span class="rv-chip late">חרגנו ${Math.ceil(over/60000)} דק'</span>` : `<span class="rv-chip ok">בזמן</span>`;
    const nav = linked ? '<div class="rv-row" style="margin-top:10px"><button type="button" class="rv-btn" data-a="prev">הקודם על המסך</button><button type="button" class="rv-btn pri" data-a="next">הבא על המסך</button></div>' : '';
    const rows = L.segments.map((x, i) => { const r = R.segs[i] || {}; const ac = actual(i), ov = ac - planned(i) * 60000;
      const fails = Object.values(r.checks || {}).filter(v => v === 'fail').length;
      const st = r.rating ? `<span class="rv-chip ${r.rating === 'ok' ? 'ok' : r.rating === 'fix' ? 'fix' : 'late'}">${RATE[r.rating]}</span>` : '';
      return `<tr class="${i === R.cur ? 'cur' : ''}"><td><button type="button" data-view="${i}">${esc(x.title)}</button></td><td class="n">${x.from >= 0 ? planned(i) : '–'}</td><td class="n" data-act="${i}">${R.started ? mins(ac) : '–'}</td><td>${R.started && x.from >= 0 && ov > 60000 ? `<span class="rv-chip late">+${Math.ceil(ov/60000)}</span>` : ''}</td><td>${st}${fails ? ` <span class="rv-chip late">${fails} נכשלו</span>` : ''}</td></tr>`; }).join('');
    return `<div class="rv-grid"><div>
      <div class="rv-card"><h2>${si === R.cur ? 'עכשיו על המסך' : 'מקטע שבחרתם'}</h2><h3>${esc(g.title)}</h3>
        <div class="rv-stat"><span>${g.from >= 0 ? `מתוכנן: דקות ${g.from}–${g.to} (${pl} דק')` : 'לפני ההתחלה'}</span><span>בפועל: <span class="rv-big" data-act-big="${si}">${R.started ? mins(a) : '–'}</span> דק'</span>${chip}${live ? '<span class="rv-chip">רץ</span>' : ''}</div>
        ${nav}</div>
      <div class="rv-card"><h2>מה אמור לקרות</h2><ol class="rv-steps">${steps}</ol></div>
      <div class="rv-card"><h2>בדיקות</h2>${checks}</div>
      <div class="rv-card"><h2>איך היה המקטע</h2>${tri('data-rate', s.rating, [['ok','עבד','on-ok'],['fix','צריך תיקון','on-fix'],['bad','לא עבד','on-fail']])}
        <p style="margin-top:12px"><label for="note-${si}">מה לתקן, או מה לשמור</label></p><textarea id="note-${si}" data-note="${si}" placeholder="למשל: הסבב לקח יותר זמן כי Suno ביקש הרשמה מחדש">${esc(s.note)}</textarea></div>
      </div><div><div class="rv-card"><h2>כל המקטעים</h2><div class="rv-tw"><table class="rv-t"><thead><tr><th>מקטע</th><th>מתוכנן</th><th>בפועל</th><th>חריגה</th><th>מצב</th></tr></thead><tbody>${rows}</tbody></table></div></div></div></div>`;
  }
  function tabDrills(){
    const items = (RH.drills || []).map((d, i) => `<div class="chk"><span class="lbl"><b>${esc(d.what)}</b><br>${esc(d.fix)}</span>${tri('data-drill-' + i, R.drills[i], [['ok','תרגלנו','on-ok'],['fail','לא עבד','on-fail']])}</div>`).join('');
    return `<div class="rv-card"><h2>תרגול תקלות</h2><p>הכלל מהמערך: אף פעם לא מחכים מול הקהל לכלי. לכל תקלה יש תגובה מוכנה, ומתרגלים אותה פעם אחת בבית.</p>${items}</div>`;
  }
  function summaryText(){
    const out = [], fixes = [], unchecked = [];
    const d = new Date(R.started || Date.now());
    out.push(`# סיכום חזרה · ${L.title} · ${L.client}`);
    out.push(`תאריך החזרה: ${d.toLocaleDateString('he-IL')} · הסדנה: ${(L.info || []).join(' · ')}`);
    const runMs = L.segments.reduce((a, g, i) => a + (g.from >= 0 ? actual(i) : 0), 0);
    if (R.started) out.push(`משך בפועל, בלי "לפני שמתחילים": ${mins(runMs)} דקות. מתוכנן: 90.`); else out.push('הריצה עוד לא התחילה, אז אין מדידת זמנים.');
    L.segments.forEach((g, i) => {
      const s = R.segs[i] || { checks:{} };
      const ov = actual(i) - planned(i) * 60000;
      if (R.started && g.from >= 0 && ov > 60000) fixes.push(`- [${g.title}] חרגנו ב-${Math.ceil(ov/60000)} דק' (${mins(actual(i))} במקום ${planned(i)}).`);
      (g.checks || []).forEach((c, ci) => { const v = (s.checks || {})[ci]; if (v === 'fail') fixes.push(`- [${g.title}] לא עבד: ${c}`); else if (!v) unchecked.push(`- [${g.title}] ${c}`); });
      if (s.rating === 'fix' || s.rating === 'bad' || (s.note || '').trim()) fixes.push(`- [${g.title}] ${s.rating ? RATE[s.rating] : 'הערה'}${(s.note || '').trim() ? `: ${s.note.trim()}` : ''}`);
    });
    (RH.drills || []).forEach((dr, i) => { if (R.drills[i] === 'fail') fixes.push(`- [תרגול תקלות] התגובה ל"${dr.what}" לא עבדה`); });
    missing.forEach(m => fixes.push(`- [קישורים] חסר במלווה: ${m}`));
    out.push('', '## מה לתקן', fixes.length ? fixes.join('\n') : '- לא סומן שום דבר לתיקון.');
    if (unchecked.length) out.push('', '## בדיקות שלא סומנו', unchecked.join('\n'));
    const notDrilled = (RH.drills || []).filter((_, i) => !R.drills[i]).map(dr => `- ${dr.what}`);
    if (notDrilled.length) out.push('', '## תקלות שלא תרגלנו', notDrilled.join('\n'));
    const notPrepped = (RH.prep || []).filter((_, i) => !R.prep[i]).map(p => `- ${p}`);
    if (notPrepped.length) out.push('', '## הכנה שלא סומנה', notPrepped.join('\n'));
    out.push('', '## לפי מקטעים', '| מקטע | מתוכנן | בפועל | מצב |', '|---|---|---|---|');
    L.segments.forEach((g, i) => { const s = R.segs[i] || {}; out.push(`| ${g.title} | ${g.from >= 0 ? planned(i) : '–'} | ${R.started ? mins(actual(i)) : '–'} | ${s.rating ? RATE[s.rating] : ''} |`); });
    if ((R.general || '').trim()) out.push('', '## הערות כלליות', R.general.trim());
    out.push('', 'מדביקים את הסיכום הזה בשיחה עם Claude, ומבקשים לתקן את המלווה ואת המערך לפי הרשימה.');
    return out.join('\n');
  }
  function tabSummary(){
    return `<div class="rv-grid"><div class="rv-card"><h2>הסיכום</h2><pre data-sum>${esc(summaryText())}</pre>
      <div class="rv-row"><button type="button" class="rv-btn pri" data-a="copy">העתקה</button><button type="button" class="rv-btn" data-a="download">שמירה כקובץ</button><span data-copied class="rv-chip" hidden>הועתק</span></div></div>
      <div><div class="rv-card"><h2>הערות כלליות</h2><p><label for="general">מה עבד טוב, מה להוריד, מה להוסיף</label></p><textarea id="general" data-general>${esc(R.general)}</textarea></div>
      <div class="rv-card"><h2>מתחילים מחדש</h2><p>מוחק את כל הסימונים והמדידות במחשב הזה.</p><button type="button" class="rv-btn" data-a="reset">חזרה חדשה</button></div></div></div>`;
  }
  function renderTab(){
    const box = root.querySelector('[data-tabbox]'); if (!box) return;
    const fns = { before:tabBefore, during:tabDuring, drills:tabDrills, summary:tabSummary };
    box.innerHTML = (fns[R.tab] || tabBefore)();
  }
  function render(){ root.innerHTML = header() + '<div data-tabbox></div>'; renderTab(); }

  root.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tab){ R.tab = b.dataset.tab; saveR(); render(); return; }
    if (b.dataset.view != null){ R.view = +b.dataset.view; if (!linked && R.started && !R.ended) moveTo(+b.dataset.view); saveR(); renderTab(); return; }
    const a = b.dataset.a;
    if (a === 'start') return startRun();
    if (a === 'end') return endRun();
    if (a === 'reset') return resetRun(b);
    if (a === 'prev' || a === 'next') return send(a);
    if (a === 'copy'){ const t = summaryText(); const done = () => { const c = root.querySelector('[data-copied]'); if (c) c.hidden = false; };
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(() => selectSum()); else selectSum(); return; }
    if (a === 'download'){ const blob = new Blob([summaryText()], { type:'text/markdown;charset=utf-8' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = `סיכום-חזרה-${L.client}.md`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); return; }
    const si = R.view >= 0 ? R.view : Math.max(0, R.cur);
    for (const k in b.dataset){
      let m;
      if ((m = k.match(/^chk-?(\d+)$/i)) || (m = k.match(/^chk(\d+)$/))){ const ci = +m[1], v = b.dataset[k]; const s = seg(si); s.checks[ci] = s.checks[ci] === v ? undefined : v; saveR(); renderTab(); return; }
      if ((m = k.match(/^drill-?(\d+)$/i)) || (m = k.match(/^drill(\d+)$/))){ const i = +m[1], v = b.dataset[k]; R.drills[i] = R.drills[i] === v ? undefined : v; saveR(); renderTab(); return; }
    }
    if (b.dataset.rate){ const s = seg(si); s.rating = s.rating === b.dataset.rate ? null : b.dataset.rate; saveR(); renderTab(); }
  });
  function selectSum(){ const pre = root.querySelector('[data-sum]'); if (!pre) return; const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  root.addEventListener('change', e => { const t = e.target; if (t.dataset.prep != null){ R.prep[+t.dataset.prep] = t.checked; saveR(); } });
  root.addEventListener('input', e => { const t = e.target;
    if (t.dataset.note != null){ seg(+t.dataset.note).note = t.value; saveR(); }
    if (t.dataset.general != null){ R.general = t.value; saveR(); const pre = root.querySelector('[data-sum]'); if (pre) pre.textContent = summaryText(); } });

  addEventListener('message', ev => {
    const d = ev.data || {}; if (d.type !== 'state') return;
    const was = linked; linked = true; mainState = d;
    const si = STEPS[d.i].seg;
    if (R.started && !R.ended) moveTo(si); else if (R.cur !== si){ R.cur = si; if (R.view < 0) R.view = si; saveR(); if (R.tab === 'during') renderTab(); }
    if (!was) render();
  });
  if (main) try { main.postMessage({ type:'hello' }, '*'); } catch(e){}
  setInterval(() => {
    if (!R.started || R.ended) return;
    root.querySelectorAll('[data-act]').forEach(el => { el.textContent = mins(actual(+el.dataset.act)); });
    root.querySelectorAll('[data-act-big]').forEach(el => { el.textContent = mins(actual(+el.dataset.actBig)); });
  }, 1000);
  render();
}

if (IS_PRESENTER) bootPresenter(); else if (location.hash === '#rehearsal') bootRehearsal(); else bootMain();
})();
</script>
</body>
</html>
