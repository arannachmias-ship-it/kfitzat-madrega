<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>סקר אנונימי · סדנת AI לכל אחד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<style>
:root{--deep:#0C2831;--bg:#113640;--card:#174652;--line:#2B5F6B;--paper:#F1F4F4;--muted:#B3C5CA;--citron:#C6D63F;--citron-ink:#1A2A0A;--warn:#F4A57E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--paper);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.kick{margin:0;color:var(--citron);font-weight:700;font-size:14px}
h1{margin:0;font-size:28px;font-weight:900;line-height:1.25}
.sub{margin:0;color:var(--muted)}
button.o{width:100%;text-align:start;border:2px solid var(--line);background:var(--card);color:var(--paper);border-radius:14px;padding:16px;font:inherit;font-size:19px;font-weight:700;cursor:pointer}
button.o:active{border-color:var(--citron)}
button.o:disabled{opacity:.5}
.done{background:var(--card);border:2px solid var(--citron);border-radius:14px;padding:18px;font-size:19px;font-weight:700}
.err{color:var(--warn)}
:focus-visible{outline:3px solid var(--citron);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p class="kick" id="kick">סקר אנונימי · בלי שם, בלי טלפון</p>
  <h1 id="q">מה הכי מתאר אתכם מול כל זה?</h1>
  <p class="sub" id="sub">בוחרים תשובה אחת. התוצאות יופיעו על המסך.</p>
  <div id="opts" style="display:flex;flex-direction:column;gap:10px">
    <button class="o" type="button" data-c="0">כולם כבר שם, ורק אני מאחור</button>
    <button class="o" type="button" data-c="1">הרבה כלים, לא יודע מאיפה להתחיל</button>
    <button class="o" type="button" data-c="2">קצת מפחיד מה זה יעשה לעבודה</button>
    <button class="o" type="button" data-c="3">מתלהב ורוצה עוד</button>
  </div>
  <p id="msg" class="sub" role="status"></p>
</main>
<script>
(function(){
  // שני סקרים באותו דף: הסקר (ברירת המחדל) והניבוי (?p=predict)
  const POLLS = {
    predict: { kick:'ניבוי · 30 שניות, בלי שם', q:'כמה עסקאות ייסגרו בחדר מול המנהל הכי קשה בישראל, עד סוף הסדנה?', sub:'מנחשים פעם אחת. בסוף הסדנה נראה מי צדק.', opts:['פחות מ-5','5 עד 10','11 עד 15','יותר מ-15'] }
  };
  const poll = POLLS[new URLSearchParams(location.search).get('p')] ? new URLSearchParams(location.search).get('p') : 'survey';
  const KEY = 'nx-danshar-voted-' + poll, opts = document.getElementById('opts'), msg = document.getElementById('msg');
  if (POLLS[poll]){
    const c = POLLS[poll];
    document.getElementById('kick').textContent = c.kick; document.getElementById('q').textContent = c.q; document.getElementById('sub').textContent = c.sub;
    document.title = 'ניבוי · סדנת AI לכל אחד';
    opts.innerHTML = '';
    c.opts.forEach((t, i) => { const b = document.createElement('button'); b.className = 'o'; b.type = 'button'; b.dataset.c = String(i); b.textContent = t; opts.appendChild(b); });
  }
  const done = () => { opts.innerHTML = poll === 'predict' ? '<div class="done">הניחוש נקלט. נגלה בסוף הסדנה.</div>' : '<div class="done">תודה. ההצבעה נקלטה, והתוצאות יופיעו על המסך.</div>'; msg.textContent = ''; };
  try { if (localStorage.getItem(KEY)) done(); } catch(e){}
  // שולחים עד שלוש פעמים: רשת של אולם יכולה להיתקע לרגע. בשגיאה אומרים מה קרה, כדי שנדע מה לתקן
  async function send(body){
    let why = '';
    for (let i = 0; i < 3; i++){
      if (i) await new Promise(r => setTimeout(r, i * 900));
      try {
        const r = await fetch('/api/live?op=vote', { method:'POST', headers:{ 'Content-Type':'application/json' }, body, cache:'no-store' });
        if (r.ok) return '';
        why = 'קוד ' + r.status;
        if (r.status >= 400 && r.status < 500 && r.status !== 429) break;
      } catch(e){ why = 'אין חיבור'; }
    }
    return why;
  }
  const fail = why => why === 'אין חיבור' ? 'לא נשלח, אין חיבור. בודקים שיש אינטרנט ולוחצים שוב.' : `לא נשלח (${why}). לוחצים שוב.`;
  opts.addEventListener('click', async e => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    opts.querySelectorAll('button').forEach(x => x.disabled = true); msg.textContent = 'שולח…';
    const why = await send(JSON.stringify({ poll, choice: Number(b.dataset.c) }));
    if (!why){
      try { localStorage.setItem(KEY, '1'); } catch(e){}
      done();
    } else {
      opts.querySelectorAll('button').forEach(x => x.disabled = false);
      msg.innerHTML = '<span class="err">' + fail(why) + '</span>';
    }
  });
})();
</script>
</body>
</html>
